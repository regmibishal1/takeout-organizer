name: Bug report
description: Something went wrong, or a photo did not get the date or place it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. Please do not attach photos or Takeout files that show
        people or places you do not want public. For a security problem, use the Security
        tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Run `takeout-organizer diagnose --dest YOUR_DESTINATION` (or use Copy diagnostics on
        the last step of the window) and paste the output. It lists versions and the last
        run's summary and warnings, with your folder paths left out. Check it before posting.
      render: text
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File names involved
      description: >
        For a matching or date problem: the photo's file name and its sidecar's file name
        (for example `IMG_1234.jpg` and `IMG_1234.jpg.supplemental-metadata.json`), and the
        sidecar's `title` and `photoTakenTime` if you can share them.
