name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run it by hand from the Actions tab

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} - py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding a runner for hours.
    timeout-minutes: 20
    env:
      TAKEOUT_GUI_TESTS: "1"   # run the window tests (off by default locally)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot
      # proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool --no-progress -y

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,heic,timezones]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Virtual display for the window tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb

      - name: Test (pytest)
        if: runner.os != 'Linux'
        run: pytest

      - name: Test (pytest, Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest

      # Capture times must not depend on the computer's time zone. Expected
      # values in the tests are relative to the machine zone or fixed, so the
      # whole suite must pass again with the clock in another zone.
      - name: Test with the computer in another time zone
        if: runner.os == 'Linux'
        env:
          TZ: Asia/Tokyo
        run: pytest
