# Publishes a release's wheel and sdist to PyPI with trusted publishing: PyPI
# trusts this workflow, so no API token is stored anywhere.
#
# It does nothing until the repository variable PUBLISH_TO_PYPI is "true",
# which is set once PyPI knows this workflow (RELEASING.md, "Publishing to PyPI").
# A release published before that can be sent by running it by hand with its
# tag.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and check
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "pyproject.toml says $version but the tag is $TAG; nothing is published."
            exit 1
          fi
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment PyPI's trusted publisher names; it can require an approval.
    environment:
      name: pypi
      url: https://pypi.org/project/takeout-organizer/
    permissions:
      id-token: write   # proves to PyPI that this workflow is the one it trusts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
